skill: the directory holding this file; passed at dispatch, never derived
bin: npx qoq
bin_if_symlinked: npm run build && npx qoq
symlink_test: test -L node_modules/@ladamczyk/qoq-cli
reports: node_modules/@ladamczyk/qoq-cli/bin/report

run:
  check: node <skill>/scripts/check.mjs <reports> [<scope>...]
  ticket: node <skill>/scripts/check.mjs <reports> --skip-knip [<scope>...]
  fix: npm run qoq:fix
  fix_if_symlinked: npm run build && npm run qoq:fix
  scoped: npx qoq staged <file>...
  ticket_scoped: npx qoq staged --skip-knip <file>...
  tools: npx qoq <tool>...
  scan: npx qoq scan --json
  format: npx qoq prettier --fix

tool_names:
  [prettier, eslint, jscpd, knip, npm, stylelint, structurelint, skillslint, justify-disable]
narrow: --skip-<tool>
exit: { 0: clean, 1: findings }

facts:
  - check and ticket are the gate; never run npx qoq --check or npm run qoq:check yourself
  - the gate runs the project's qoq:check, fix runs qoq:fix, both verbatim; no other script is read
  - each must be a single qoq command, because check appends -- --json
  - check exit is 0 clean, 1 findings, 2 no verdict (missing script, failed build, CLI crash); 2 is never PASS
  - check reuses reports only when they are current and the same mode and script wrote them, empties them before a run, and builds first when the CLI is symlinked
  - the digest's first line quotes the script that ran
  - positional args are tool names, never paths
  - staged is the only path-scoped form
  - staged takes no --json and no --fix, and writes no reports
  - no --json, no reports, no digest
  - never pass --output
  - scan is a subcommand, not a tool name; it reads package-lock.json, needs the network, and is never part of --check
  - knip ignores the file list; staged runs it repo-wide like every other form
  - ticket forms drop knip because half the milestone does not exist yet

digest:
  raw: open one report only for one finding's line numbers; clone code is read from the source files at the digest's line ranges

may_run:
  bump: [check, tools, scan]
  fix: [check, ticket, fix, fix_if_symlinked]
  qoq-developer: [ticket_scoped]
  qoq-tester: [scoped]
  qoq-bumper: []
  qoq-designer: []
  document: [format]
  qoq-scribe: []
  mermaid: [format]
  qoq-artist: []
  qoq-sheriff: []
  qoq-reviewer: []
