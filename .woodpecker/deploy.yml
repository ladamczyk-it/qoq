# Builds qoq's Docs site and replaces the vhost root nginx serves, ~/artifacts/qoq. Runs on pushes to master,
# which include the release commit and docs.yml's `docs: sync` commit; tags only regenerate the docs (docs.yml).
# Volumes need the repo marked trusted in Woodpecker.
when:
  - event: push
    branch: master
  - event: manual

# Full history: the sitemap's <lastmod> and each doc's "last updated" read the page's last commit date.
clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0

steps:
  # Holds only the Verdaccio token. Lifecycle scripts stay off, so no package code runs beside it. First, because
  # every later step runs package code that could rewrite the workspace's .npmrc.
  - name: install-website
    image: node:22
    environment:
      VERDACCIO_CI_TOKEN:
        from_secret: verdaccio_ci_token
    commands:
      - npm ci --prefix website --ignore-scripts

  # Holds no secret. Unlike the siblings, the site's preset pages embed config inspectors, and their
  # packages/eslint-v9-*/stats are gitignored: the website's prebuild copies them from here.
  - name: build-inspectors
    image: node:22
    commands:
      - npm ci
      - npm run build
      - npm run config-inspector -- all

  # Holds no secret: the Docusaurus build loads the installed packages' code.
  - name: build
    image: node:22
    commands:
      - npm run build --prefix website

  # Holds no secret and runs only find and cp: the one step that sees the served root.
  - name: deploy
    image: node:22
    commands:
      - find /usr/build -mindepth 1 -delete
      - cp -r website/build/. /usr/build/
    volumes:
      - /home/joke/artifacts/qoq:/usr/build
